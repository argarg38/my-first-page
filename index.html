<title>바이브코딩 4주 처방전</title>

<style>
  /* ══ 색 토큰 : 밝은 테마(기본) ════════════════════════════ */
  :root {
    --bg:          #F2F2F7;   /* iOS systemGroupedBackground */
    --card:        #FFFFFF;
    --card-sunken: #F2F2F7;
    --ink:         #000000;
    --ink-2:       #3C3C43;
    --ink-3:       #8A8A8E;
    --line:        rgba(60, 60, 67, .20);
    --line-strong: rgba(60, 60, 67, .30);

    --green:       #34C759;
    --green-ink:   #248A3D;
    --green-tint:  rgba(52, 199, 89, .14);
    --blue:        #007AFF;
    --blue-tint:   rgba(0, 122, 255, .12);
    --orange:      #FF9500;
    --orange-ink:  #C56A00;
    --orange-tint: rgba(255, 149, 0, .14);
    --grey-fill:   rgba(120, 120, 128, .16);

    --nav-bg:      rgba(242, 242, 247, .78);
    --shadow:      0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px -14px rgba(0, 0, 0, .22);

    --font: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", -apple-system,
            BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

    --r-card: 16px;
    --r-tile: 7px;
    --ease: cubic-bezier(.32, .72, 0, 1);

    color-scheme: light;
  }

  /* 시스템이 어두울 때 (밝은 테마를 직접 고른 경우는 제외) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #000000;
      --card:        #1C1C1E;
      --card-sunken: #2C2C2E;
      --ink:         #FFFFFF;
      --ink-2:       #EBEBF5;
      --ink-3:       #98989F;
      --line:        rgba(84, 84, 88, .55);
      --line-strong: rgba(84, 84, 88, .75);

      --green:       #30D158;
      --green-ink:   #30D158;
      --green-tint:  rgba(48, 209, 88, .18);
      --blue:        #0A84FF;
      --blue-tint:   rgba(10, 132, 255, .18);
      --orange:      #FF9F0A;
      --orange-ink:  #FF9F0A;
      --orange-tint: rgba(255, 159, 10, .18);
      --grey-fill:   rgba(120, 120, 128, .32);

      --nav-bg:      rgba(20, 20, 22, .74);
      --shadow:      0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -14px rgba(0, 0, 0, .9);
      color-scheme: dark;
    }
  }

  /* 어두운 테마를 직접 고른 경우 */
  :root[data-theme="dark"] {
    --bg:          #000000;
    --card:        #1C1C1E;
    --card-sunken: #2C2C2E;
    --ink:         #FFFFFF;
    --ink-2:       #EBEBF5;
    --ink-3:       #98989F;
    --line:        rgba(84, 84, 88, .55);
    --line-strong: rgba(84, 84, 88, .75);

    --green:       #30D158;
    --green-ink:   #30D158;
    --green-tint:  rgba(48, 209, 88, .18);
    --blue:        #0A84FF;
    --blue-tint:   rgba(10, 132, 255, .18);
    --orange:      #FF9F0A;
    --orange-ink:  #FF9F0A;
    --orange-tint: rgba(255, 159, 10, .18);
    --grey-fill:   rgba(120, 120, 128, .32);

    --nav-bg:      rgba(20, 20, 22, .74);
    --shadow:      0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -14px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }

  /* ══ 기본 ════════════════════════════════════════════════ */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.6;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
  }

  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 8px; }

  .tnum { font-variant-numeric: tabular-nums; }

  /* ══ 내비게이션 바 (스크롤하면 제목이 나타남) ══════════════ */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 10;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 56px;
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: background .25s var(--ease), border-color .25s var(--ease);
  }
  .navbar.is-scrolled {
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom-color: var(--line);
  }
  .nav-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.02em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .25s var(--ease), transform .25s var(--ease);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .navbar.is-scrolled .nav-title { opacity: 1; transform: none; }

  /* ══ 페이지 ══════════════════════════════════════════════ */
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 20px calc(56px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  /* ── 라지 타이틀 ── */
  .hero { display: flex; flex-direction: column; gap: 12px; padding: 20px 4px 4px; }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    align-self: flex-start;
    font-size: 13px;
    font-weight: 600;
    color: var(--green-ink);
    background: var(--green-tint);
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: -.01em;
  }
  .kicker::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
  }

  .hero h1 {
    font-size: clamp(32px, 7vw, 42px);
    line-height: 1.22;
    letter-spacing: -.03em;
  }
  .hero-sub {
    font-size: 16px;
    color: var(--ink-3);
    max-width: 46ch;
    line-height: 1.62;
  }

  /* ══ 그룹 (iOS 인셋 리스트) ═══════════════════════════════ */
  .group { display: flex; flex-direction: column; gap: 9px; }
  .group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    letter-spacing: -.005em;
    padding-left: 17px;
  }

  .card {
    background: var(--card);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
  }

  /* ── 리스트 행 (구분선은 왼쪽 인셋) ── */
  .row {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 17px;
    font-size: 16px;
  }
  .row:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 17px; right: 0; bottom: 0;
    height: 1px;
    background: var(--line);
  }
  .row-key { color: var(--ink-3); flex: none; }
  .row-val { text-align: right; color: var(--ink); }
  .row-val .sub { color: var(--ink-3); font-size: 14px; }

  /* ══ 진행 상황 카드 ═══════════════════════════════════════ */
  .progress {
    padding: 20px 17px 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .progress-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .progress-count { display: flex; align-items: baseline; gap: 4px; letter-spacing: -.03em; }
  .progress-count b { font-size: 40px; font-weight: 700; line-height: 1; color: var(--green-ink); }
  .progress-count span { font-size: 17px; color: var(--ink-3); font-weight: 600; }

  .progress-state {
    font-size: 13px;
    font-weight: 600;
    color: var(--green-ink);
    background: var(--green-tint);
    padding: 5px 11px;
    border-radius: 999px;
  }

  .bars { display: flex; gap: 6px; }
  .bar {
    flex: 1;
    height: 10px;
    border-radius: 999px;
    background: var(--grey-fill);
    overflow: hidden;
  }
  .bar[data-state="done"] { background: var(--green); }
  .bar[data-state="active"] { background: var(--grey-fill); }
  .bar[data-state="active"]::before {
    content: "";
    display: block;
    width: 55%;
    height: 100%;
    border-radius: 999px;
    background: var(--green);
  }
  .progress-note { font-size: 13px; color: var(--ink-3); }

  /* ══ 주차 카드 ════════════════════════════════════════════ */
  .weeks { display: flex; flex-direction: column; gap: 14px; }

  .week {
    padding: 17px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform .3s var(--ease);
  }
  .week[data-state="upcoming"] { box-shadow: none; background: transparent; border: 1px solid var(--line); }

  .week-head { display: flex; align-items: center; gap: 13px; }
  .badge {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--green);
    color: #FFFFFF;
    display: grid;
    place-items: center;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .week[data-state="upcoming"] .badge { background: var(--grey-fill); color: var(--ink-3); }

  .week-heading { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .week-heading h3 { font-size: 18px; line-height: 1.35; }
  .week-date { font-size: 13px; color: var(--ink-3); letter-spacing: 0; }
  .week[data-state="upcoming"] .week-heading h3 { color: var(--ink-2); }

  .status {
    flex: none;
    align-self: flex-start;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--grey-fill);
    color: var(--ink-3);
    white-space: nowrap;
  }
  .status[data-state="done"]   { background: var(--green-tint); color: var(--green-ink); }
  .status[data-state="active"] { background: var(--green); color: #FFFFFF; }

  .week-desc { font-size: 15.5px; color: var(--ink-2); line-height: 1.65; }
  .week[data-state="upcoming"] .week-desc { color: var(--ink-3); }

  /* ── 노트 블록 ── */
  .notes {
    background: var(--card-sunken);
    border-radius: 12px;
    padding: 4px 0;
  }
  .week[data-state="upcoming"] .notes { background: transparent; padding: 0; }

  .note {
    position: relative;
    display: flex;
    gap: 12px;
    padding: 11px 14px;
  }
  .note:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 46px; right: 14px; bottom: 0;
    height: 1px;
    background: var(--line);
  }

  .tile {
    flex: none;
    width: 24px; height: 24px;
    border-radius: var(--r-tile);
    display: grid;
    place-items: center;
    margin-top: 2px;
  }
  .tile svg { width: 13px; height: 13px; fill: #FFFFFF; display: block; }
  .note[data-kind="learn"] .tile { background: var(--green); }
  .note[data-kind="make"]  .tile { background: var(--blue); }
  .note[data-kind="block"] .tile { background: var(--orange); }

  .note-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .note-label { font-size: 12.5px; font-weight: 600; color: var(--ink-3); letter-spacing: -.005em; }
  .note-body ul { display: flex; flex-direction: column; gap: 3px; font-size: 15px; color: var(--ink-2); line-height: 1.55; }

  /* ══ 도구 칩 ══════════════════════════════════════════════ */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 14.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform .25s var(--ease);
  }
  .chip[data-planned="true"] {
    background: transparent;
    box-shadow: none;
    border: 1px dashed var(--line-strong);
    color: var(--ink-3);
  }
  .chip:hover { transform: translateY(-2px); }
  .chip[data-planned="true"]:hover { transform: none; }

  /* ══ 목표 ═════════════════════════════════════════════════ */
  .goal {
    position: relative;
    display: flex;
    gap: 13px;
    padding: 14px 17px;
  }
  .goal:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 47px; right: 0; bottom: 0;
    height: 1px;
    background: var(--line);
  }
  .goal-tile {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--blue-tint);
    color: var(--blue);
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
    margin-top: 1px;
  }
  .goal-body { display: flex; flex-direction: column; gap: 2px; }
  .goal-body h3 { font-size: 16px; }
  .goal-body p { font-size: 14.5px; color: var(--ink-3); line-height: 1.55; }

  /* ══ 꼬리말 ═══════════════════════════════════════════════ */
  .colophon {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    text-align: center;
    font-size: 13px;
    color: var(--ink-3);
    padding-top: 10px;
  }

  /* ══ 좁은 화면 ════════════════════════════════════════════ */
  @media (max-width: 520px) {
    .page { padding-left: 16px; padding-right: 16px; }
    .row { flex-direction: column; align-items: flex-start; gap: 2px; }
    .row-val { text-align: left; }
    .week-head { flex-wrap: wrap; }
    .week-heading { flex-basis: calc(100% - 47px); }
    .status { margin-left: 47px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<nav class="navbar" id="navbar">

</main>

    상태: "upcoming",
    제목: "세상에 내보내고, 4주를 돌아보기",
    설명: "내 컴퓨터 안에만 있던 페이지를 인터넷에 올려서 링크로 공유하고, 4주 전의 나와 비교하며 회고를 남길 예정이다.",
    배운것: ["(작성 예정)"],
    만든것: ["(작성 예정)"],
    막힌것: ["(작성 예정)"]
  }
];

const 도구목록 = [
  { 이름: "Claude Code",  예정: false },
  { 이름: "HTML",         예정: false },
  { 이름: "CSS",          예정: false },
  { 이름: "VS Code",      예정: false },
  { 이름: "Git · GitHub", 예정: false },
  { 이름: "GitHub Pages", 예정: false },
  { 이름: "JavaScript",   예정: true  }
];

const 목표 = [
  { 제목: "혼자서도 고칠 수 있기", 설명: "받은 코드를 그대로 쓰는 게 아니라, 어디를 건드리면 뭐가 바뀌는지 알고 고치는 상태." },
  { 제목: "링크로 보여줄 수 있는 결과물", 설명: "내 컴퓨터 밖에서도 열리는, 주소 하나로 공유되는 페이지 한 개." },
  { 제목: "약대생의 시선이 담긴 무언가", 설명: "코딩을 위한 코딩이 아니라, 복약이나 건강 정보처럼 내가 아는 문제를 다루는 작은 결과물." }
];

/* ════════════════════════════════════════════════════════════
   ▲▲▲ 여기까지 ▲▲▲   아래는 화면을 그리는 부분입니다
   ════════════════════════════════════════════════════════════ */

const 상태이름 = { done: "완료", active: "진행 중", upcoming: "예정" };

const ICON = {
  learn: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 12.5 1.9 8.2l1.4-1.4 2.9 2.9 6.5-6.5 1.4 1.4z"/></svg>',
  make:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1.5h2v5h5v2H9v5H7v-5H2v-2h5z"/></svg>',
  block: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2h2v7.2H7zm0 9h2v2.2H7z"/></svg>'
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* 목록 항목은 글자만 써도 되고, 주소를 달고 싶으면 { 글: "...", 주소: "https://..." } 로 써도 됩니다 */
const 항목 = (t) => {
  if (typeof t === "string") return `<li>${esc(t)}</li>`;
  const 보일주소 = t.주소.replace(/^https?:\/\//, "").replace(/\/$/, "");
  return `<li>${esc(t.글)} — <a href="${esc(t.주소)}" target="_blank" rel="noopener noreferrer">${esc(보일주소)}</a></li>`;
};
const 목록 = (arr) => `<ul>${arr.map(항목).join("")}</ul>`;

/* 처방 정보 */
document.getElementById("slip").innerHTML = [
  ["수강생", `${esc(내정보.이름)} <span class="sub">· ${esc(내정보.소속)}</span>`],
  ["처방 내용", esc(내정보.트랙)],
  ["처방 기간", `<span class="tnum">${esc(내정보.기간)}</span>`],
  ["용법 · 용량", esc(내정보.용법)]
].map(([k, v]) => `<div class="row"><span class="row-key">${k}</span><span class="row-val">${v}</span></div>`).join("");

/* 진행 상황 */
const 완료수 = 주차기록.filter((w) => w.상태 === "done").length;
const 진행중 = 주차기록.find((w) => w.상태 === "active");

document.getElementById("progress").innerHTML = `
  <div class="progress-top">
    <span class="progress-count"><b class="tnum">${완료수}</b><span>/ ${주차기록.length}회 복용</span></span>
    <span class="progress-state">${진행중 ? `${진행중.회차}주차 진행 중` : (완료수 === 주차기록.length ? "처방 완료" : "대기 중")}</span>
  </div>
  <div class="bars" role="img" aria-label="4주 중 ${완료수}주 완료">
    ${주차기록.map((w) => `<span class="bar" data-state="${w.상태}"></span>`).join("")}
  </div>
  <p class="progress-note">${진행중 ? esc(진행중.제목) + " · 기록 작성 중" : "다음 회차를 기다리는 중"}</p>
`;

/* 주차별 기록 */
document.getElementById("weeks").innerHTML = 주차기록.map((w) => `
  <li class="card week" data-state="${w.상태}">
    <div class="week-head">
      <span class="badge tnum">${w.회차}</span>
      <div class="week-heading">
        <h3>${esc(w.제목)}</h3>
        <span class="week-date tnum">${esc(w.날짜)}</span>
      </div>
      <span class="status" data-state="${w.상태}">${상태이름[w.상태]}</span>
    </div>
    <p class="week-desc">${esc(w.설명)}</p>
    <div class="notes">
      <div class="note" data-kind="learn">
        <span class="tile">${ICON.learn}</span>
        <div class="note-body"><span class="note-label">효능 · 배운 것</span>${목록(w.배운것)}</div>
      </div>
      <div class="note" data-kind="make">
        <span class="tile">${ICON.make}</span>
        <div class="note-body"><span class="note-label">조제 · 만든 것</span>${목록(w.만든것)}</div>
      </div>
      <div class="note" data-kind="block">
        <span class="tile">${ICON.block}</span>
        <div class="note-body"><span class="note-label">부작용 · 막힌 것</span>${목록(w.막힌것)}</div>
      </div>
    </div>
  </li>
`).join("");

/* 도구 */
document.getElementById("tools").innerHTML = 도구목록
  .map((t) => `<li class="chip" data-planned="${t.예정}">${esc(t.이름)}</li>`)
  .join("");

/* 목표 */
document.getElementById("goals").innerHTML = 목표.map((g, i) => `
  <div class="goal">
    <span class="goal-tile tnum">${i + 1}</span>
    <div class="goal-body"><h3>${esc(g.제목)}</h3><p>${esc(g.설명)}</p></div>
  </div>
`).join("");

/* 꼬리말 */
document.getElementById("colophon-who").textContent = `기록 · ${내정보.이름} (${내정보.소속})`;

/* 스크롤하면 상단 바에 제목이 나타나는 iOS 동작 */
const navbar = document.getElementById("navbar");
const largeTitle = document.getElementById("large-title");
const onScroll = () => {
  navbar.classList.toggle("is-scrolled", largeTitle.getBoundingClientRect().bottom < 46);
};
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();
</script>
